<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韩语单字发音强化训练器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 850px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            padding: 24px;
            position: relative;
        }

        @media (max-width: 640px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* 左侧卡片区域 */
        .card-section {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px 20px 20px;
            min-height: 380px;
        }

        .status-badge {
            font-size: 14px;
            font-weight: 600;
            color: #2563eb;
            background: #eff6ff;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #bfdbfe;
        }

        .status-badge.wrong-phase {
            color: #e11d48;
            background: #fff1f2;
            border-color: #fecdd3;
        }

        .korean-char {
            font-size: 110px;
            font-weight: 700;
            color: #0f172a;
            user-select: none;
            margin-top: auto;
            margin-bottom: auto;
        }

        .score-board {
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
        }

        /* 右侧交互区域 */
        .interactive-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 12px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 20px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }

        .option-btn.wrong {
            background-color: #ffe4e6 !important;
            border-color: #f43f5e !important;
            color: #be123c !important;
        }

        .action-area {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .feedback {
            height: 24px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
        }

        .feedback.correct { color: #15803d; }
        .feedback.wrong { color: #be123c; }

        .next-btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .next-btn:hover:not(:disabled) {
            background-color: #1d4ed8;
        }

        .next-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* 完成总结遮罩层 */
        .summary-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            z-index: 10;
        }

        .summary-overlay.hidden {
            display: none;
        }

        .summary-title {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .summary-desc {
            font-size: 16px;
            color: #475569;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .summary-btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .summary-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 结算/阶段过渡遮罩 -->
    <div id="summaryOverlay" class="summary-overlay hidden">
        <div id="summaryTitle" class="summary-title">第一轮练习完成！</div>
        <div id="summaryDesc" class="summary-desc">你一共答对了 15/20 题。<br>接下来将对 5 个错题进行清空强化训练。</div>
        <button id="summaryBtn" class="summary-btn" onclick="handleSummaryAction()">开始错题挑战 (Space)</button>
    </div>

    <!-- 左侧展示区 -->
    <div class="card-section">
        <div id="statusBadge" class="status-badge">常规练习 1 / 20</div>
        <div id="koreanChar" class="korean-char">한</div>
        <div id="scoreBoard" class="score-board">正确率: 0 / 0 (0%)</div>
    </div>

    <!-- 右侧交互区 -->
    <div class="interactive-section">
        <div class="title">请选择正确的罗马字发音：</div>
        
        <div class="options-grid" id="optionsGrid">
            <button class="option-btn" onclick="selectOption(0)"></button>
            <button class="option-btn" onclick="selectOption(1)"></button>
            <button class="option-btn" onclick="selectOption(2)"></button>
            <button class="option-btn" onclick="selectOption(3)"></button>
        </div>

        <div class="action-area">
            <div id="feedback" class="feedback"></div>
            <button id="nextBtn" class="next-btn" onclick="nextQuestion()" disabled>下一题 (Space)</button>
        </div>
    </div>
</div>

<script>
    // 标准韩语发音扩充词库
    const wordBank = [
        { char: "가", roman: "ga" }, { char: "나", roman: "na" }, { char: "다", roman: "da" },
        { char: "라", roman: "ra" }, { char: "마", roman: "ma" }, { char: "바", roman: "ba" },
        { char: "사", roman: "sa" }, { char: "아", roman: "a"  }, { char: "자", roman: "ja" },
        { char: "차", roman: "cha"}, { char: "카", roman: "ka" }, { char: "타", roman: "ta" },
        { char: "파", roman: "pa" }, { char: "하", roman: "ha" }, { char: "까", roman: "kka"},
        { char: "따", roman: "tta"}, { char: "빠", roman: "ppa"}, { char: "싸", roman: "ssa"},
        { char: "짜", roman: "jja"}, { char: "고", roman: "go" }, { char: "노", roman: "no" },
        { char: "구", roman: "gu" }, { char: "두", roman: "du" }, { char: "그", roman: "geu"},
        { char: "느", roman: "neu"}, { char: "기", roman: "gi" }, { char: "디", roman: "di" },
        { char: "시", roman: "si" }, { char: "서", roman: "seo"}, { char: "머", roman: "meo"},
        { char: "너", roman: "neo"}, { char: "개", roman: "gae"}, { char: "내", roman: "nae"},
        { char: "게", roman: "ge" }, { char: "세", roman: "se" }, { char: "과", roman: "gwa"},
        { char: "화", roman: "hwa"}, { char: "귀", roman: "gwi"}, { char: "외", roman: "oe" },
        { char: "의", roman: "ui" }, { char: "웨", roman: "we" }, { char: "워", roman: "weo"},
        { char: "각", roman: "gak"}, { char: "낙", roman: "nak"}, { char: "산", roman: "san"},
        { char: "눈", roman: "nun"}, { char: "달", roman: "dal"}, { char: "물", roman: "mul"},
        { char: "봄", roman: "bom"}, { char: "남", roman: "nam"}, { char: "밥", roman: "bap"},
        { char: "집", roman: "jip"}, { char: "강", roman: "gang"},{ char: "빵", roman: "ppang"},
        { char: "옷", roman: "ot" }, { char: "꽃", roman: "kkot"},{ char: "빛", roman: "bit"},
        { char: "닭", roman: "dak"}, { char: "삶", roman: "sam"}, { char: "값", roman: "gap"},
        { char: "앉", roman: "an" }, { char: "읽", roman: "ik" }, { char: "한", roman: "han"},
        { char: "글", roman: "geul"},{ char: "국", roman: "guk"}, { char: "민", roman: "min"},
        { char: "정", roman: "jeong"},{ char: "음", roman: "eum"},{ char: "손", roman: "son"},
        { char: "발", roman: "bal"}, { char: "꿈", roman: "kkum"},{ char: "돈", roman: "don"},
        { char: "낮", roman: "nat"}, { char: "밤", roman: "bam"}
    ];

    const ROUND_SIZE = 20; // 每一轮固定题目数量

    // 训练状态变量
    let currentPool = [];       // 当前待出题集合
    let wrongPool = [];         // 本轮积累的错题集
    let isWrongPhase = false;   // 是否处于错题重练阶段
    let currentIndex = 0;       // 当前题目索引
    
    let currentWord = null;
    let currentOptions = [];
    let isAnswered = false;
    
    let totalStats = { total: 0, correct: 0 }; // 统计信息

    // DOM 元素引用
    const charEl = document.getElementById('koreanChar');
    const scoreEl = document.getElementById('scoreBoard');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const optionBtns = document.querySelectorAll('.option-btn');
    const statusBadge = document.getElementById('statusBadge');
    
    const summaryOverlay = document.getElementById('summaryOverlay');
    const summaryTitle = document.getElementById('summaryTitle');
    const summaryDesc = document.getElementById('summaryDesc');
    const summaryBtn = document.getElementById('summaryBtn');

    // 开启全新一轮 (20 题)
    function startNewRound() {
        summaryOverlay.classList.add('hidden');
        isWrongPhase = false;
        wrongPool = [];
        currentIndex = 0;
        totalStats = { total: 0, correct: 0 };

        // 随机打乱完整词库并截取 20 个
        let shuffled = [...wordBank].sort(() => Math.random() - 0.5);
        currentPool = shuffled.slice(0, Math.min(ROUND_SIZE, shuffled.length));

        loadQuestion();
    }

    // 开启错题重练阶段
    function startWrongPhase() {
        summaryOverlay.classList.add('hidden');
        isWrongPhase = true;
        // 将错题打乱作为新的待考池，同时重置错题集
        currentPool = [...wrongPool].sort(() => Math.random() - 0.5);
        wrongPool = [];
        currentIndex = 0;

        loadQuestion();
    }

    // 加载当前题目
    function loadQuestion() {
        isAnswered = false;
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        nextBtn.disabled = true;

        // 更新状态角标
        if (!isWrongPhase) {
            statusBadge.textContent = `常规练习 ${currentIndex + 1} / ${currentPool.length}`;
            statusBadge.classList.remove('wrong-phase');
        } else {
            statusBadge.textContent = `错题重练 ${currentIndex + 1} / ${currentPool.length}`;
            statusBadge.classList.add('wrong-phase');
        }

        // 当前题目目标
        currentWord = currentPool[currentIndex];
        charEl.textContent = currentWord.char;

        // 生成 4 个选项（1 正确 + 3 干扰）
        let optionsSet = new Set([currentWord.roman]);
        while (optionsSet.size < 4) {
            let randomWord = wordBank[Math.floor(Math.random() * wordBank.length)];
            optionsSet.add(randomWord.roman);
        }

        currentOptions = Array.from(optionsSet).sort(() => Math.random() - 0.5);

        // 渲染选项按钮
        optionBtns.forEach((btn, index) => {
            btn.textContent = currentOptions[index];
            btn.className = 'option-btn';
            btn.disabled = false;
        });
    }

    // 选择答案
    function selectOption(index) {
        if (isAnswered) return;

        isAnswered = true;
        totalStats.total++;
        const selectedRoman = currentOptions[index];

        if (selectedRoman === currentWord.roman) {
            totalStats.correct++;
            optionBtns[index].classList.add('correct');
            feedbackEl.textContent = '正确！';
            feedbackEl.className = 'feedback correct';
        } else {
            optionBtns[index].classList.add('wrong');
            feedbackEl.textContent = `错误！正确发音是: ${currentWord.roman}`;
            feedbackEl.className = 'feedback wrong';
            
            // 记录到错题集 (防止重复添加)
            if (!wrongPool.some(item => item.char === currentWord.char)) {
                wrongPool.push(currentWord);
            }

            // 高亮正确选项
            optionBtns.forEach((btn, i) => {
                if (currentOptions[i] === currentWord.roman) {
                    btn.classList.add('correct');
                }
            });
        }

        // 禁用选项
        optionBtns.forEach(btn => btn.disabled = true);

        // 更新左侧得分板
        const accuracy = ((totalStats.correct / totalStats.total) * 100).toFixed(1);
        scoreEl.textContent = `正确率: ${totalStats.correct} / ${totalStats.total} (${accuracy}%)`;

        // 启用下一题按钮
        nextBtn.disabled = false;
    }

    // 点击下一题或空格快捷键
    function nextQuestion() {
        currentIndex++;

        if (currentIndex < currentPool.length) {
            loadQuestion();
        } else {
            // 当前集合（首轮20题或某一轮错题集）练习结束
            checkPhaseCompletion();
        }
    }

    // 判断本阶段结束后的走向
    function checkPhaseCompletion() {
        if (wrongPool.length > 0) {
            // 仍有错题，提示进入错题挑战
            if (!isWrongPhase) {
                summaryTitle.textContent = "常规练习完成！";
                summaryDesc.innerHTML = `首轮 20 题已完成。<br>答对 <strong>${ROUND_SIZE - wrongPool.length}</strong> 题，剩余 <strong>${wrongPool.length}</strong> 个错题需要强化。`;
            } else {
                summaryTitle.textContent = "错题轮次结束";
                summaryDesc.innerHTML = `还剩 <strong>${wrongPool.length}</strong> 个错题尚未攻克。<br>继续加油，直至全部清空！`;
            }
            summaryBtn.textContent = "开始错题挑战 (Space)";
            summaryBtn.setAttribute('data-action', 'wrong-phase');
            summaryOverlay.classList.remove('hidden');
        } else {
            // 错题全部清空！成功通关
            summaryTitle.textContent = "🎉 恭喜通关！";
            summaryDesc.innerHTML = `你已成功清空所有错题，完美掌握了本轮的所有发音！`;
            summaryBtn.textContent = "开始新一轮练习 (Space)";
            summaryBtn.setAttribute('data-action', 'new-round');
            summaryOverlay.classList.remove('hidden');
        }
    }

    // 遮罩层按钮点击逻辑
    function handleSummaryAction() {
        const action = summaryBtn.getAttribute('data-action');
        if (action === 'wrong-phase') {
            startWrongPhase();
        } else {
            startNewRound();
        }
    }

    // 全局键盘 Space (空格键) 支持
    document.addEventListener('keydown', (event) => {
        if (event.key === ' ' || event.code === 'Space') {
            event.preventDefault(); // 阻止页面滚动

            // 如果处于遮罩结算页，空格触发结算按钮
            if (!summaryOverlay.classList.contains('hidden')) {
                handleSummaryAction();
                return;
            }

            // 如果下一题按钮可用，空格进入下一题
            if (!nextBtn.disabled) {
                nextQuestion();
            }
        }
    });

    // 初始化启动首轮训练
    startNewRound();
</script>

</body>
</html>
